---
- name: Deploy LightHouse static site with Nginx
  hosts: lighthouse
  become: yes
  tasks:
    - name: Install required packages (git, nginx)
      apt:
        name:
          - git
          - nginx
        state: present
        update_cache: yes

    - name: Clone LightHouse repository
      git:
        repo: 'https://github.com/VKCOM/lighthouse'
        dest: /opt/lighthouse
        version: main
        force: yes
      notify: restart nginx

    - name: Create nginx config for LightHouse
      template:
        src: |
          server {
              listen 80;
              server_name _;

              root /opt/lighthouse;
              index index.html;

              location / {
                  try_files $uri $uri/ =404;
              }

              # Disable access logs for static files
              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
                  access_log off;
              }
          }
        dest: /etc/nginx/sites-available/lighthouse.conf
      notify: reload nginx

    - name: Enable LightHouse site
      file:
        src: /etc/nginx/sites-available/lighthouse.conf
        dest: /etc/nginx/sites-enabled/lighthouse.conf
        state: link
      notify: reload nginx

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx

    - name: Ensure nginx is running and enabled
      systemd:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

